<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dino Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f4f4; font-family: sans-serif; overflow: hidden; }
    .game {
      width: 100%;
      height: 200px;
      background: white;
      border: 2px solid #ccc;
      position: relative;
      overflow: hidden;
    }
    .dino {
      width: 40px;
      height: 40px;
      background: black;
      position: absolute;
      bottom: 0;
      left: 50px;
    }
    .cactus {
      width: 20px;
      height: 40px;
      background: green;
      position: absolute;
      bottom: 0;
      right: -20px;
      animation: cactusMove 2s linear infinite;
    }
    @keyframes cactusMove {
      0% { right: -20px; }
      100% { right: 100%; }
    }
    .jump {
      animation: jump 0.5s ease-out;
    }
    @keyframes jump {
      0% { bottom: 0; }
      50% { bottom: 80px; }
      100% { bottom: 0; }
    }
  </style>
</head>
<body>

  <h1 style="text-align:center;">Google Dino Game Clone</h1>
  <div class="game">
    <div class="dino" id="dino"></div>
    <div class="cactus" id="cactus"></div>
  </div>

  <script>
    const dino = document.getElementById("dino");
    const cactus = document.getElementById("cactus");

    document.addEventListener("keydown", function(event) {
      if (event.code === "Space" && !dino.classList.contains("jump")) {
        dino.classList.add("jump");
        setTimeout(() => dino.classList.remove("jump"), 500);
      }
    });

    let isAlive = setInterval(function () {
      let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("top"));
      let cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("left"));

      if (cactusLeft < 70 && cactusLeft > 40 && dinoTop >= 140) {
        alert("Game Over!");
        cactus.style.animation = "none";
        cactus.style.display = "none";
        clearInterval(isAlive);
      }
    }, 10);
  </script>

</body>
</html>
