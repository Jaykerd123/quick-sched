<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gradient Text Link</title>
  <style>
    .gradient-link {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      text-decoration: none;
    }

    .gradient-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="https://example.com" class="gradient-link">Click Me</a>

</body>
</html>
